<!-- =========================================================
     GABARIT — CARTE FILIALE
     ========================================================= -->

<a
  class="m-card"
  href="#"
  aria-label="Découvrir la filiale"
>

  <!-- Accent couleur de la filiale -->
  <span
    class="m-card__accent"
    aria-hidden="true"
  ></span>


  <!-- En-tête -->
  <div class="m-card__entete">

    <img
      class="m-card__logo"
      src=""
      alt=""
      loading="lazy"
    >

    <span
      class="m-card__indicateur"
      aria-hidden="true"
    ></span>

  </div>


  <!-- Illustration du domaine -->
  <div
    class="m-card__visuel"
    aria-hidden="true"
  >

    <img
      class="m-card__illustration"
      src=""
      alt=""
      loading="lazy"
    >

  </div>


  <!-- Contenu -->
  <div class="m-card__contenu">

    <p class="m-card__domaine"></p>

    <h3 class="m-card__titre"></h3>

    <p class="m-card__description"></p>

  </div>


  <!-- Action -->
  <span class="m-card__action">

    <span>Découvrir</span>

    <span
      class="m-card__fleche"
      aria-hidden="true"
    >→</span>

  </span>

</a>
